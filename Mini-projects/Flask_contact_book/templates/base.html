<!DOCTYPE html>
<html>



<head>

    <title>Contact Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded mb-4">

        <div class="container-fluid">

            <a class="navbar-brand" href="{{ url_for('contacts.home') }}">
                📇 Contact Book
            </a>

            <div>

                <a class="btn btn-outline-light me-2"
                href="{{ url_for('contacts.home') }}">
                    Home
                </a>

                {% if session.get("user_id") %}

                    <a class="btn btn-outline-light me-2"
                    href="{{ url_for('contacts.view_page') }}">
                        Contacts
                    </a>

                    <a class="btn btn-success me-2"
                    href="{{ url_for('contacts.add_page') }}">
                        Add Contact
                    </a>

                    <a class="btn btn-danger"
                    href="{{ url_for('auth.logout') }}">
                        Logout
                    </a>

                {% else %}

                    <a class="btn btn-primary me-2"
                    href="{{ url_for('auth.login_page') }}">
                        Login
                    </a>

                    <a class="btn btn-success"
                    href="{{ url_for('auth.register_page') }}">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-success">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    {% block content %}

    {% endblock %}

</div>

</body>

</html>
