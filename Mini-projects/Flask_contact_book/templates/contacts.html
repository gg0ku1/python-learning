{% extends "base.html" %}
{% block content %}

<h1>Contacts:</h1>
{% if contacts %}
    <ol>
    {% for contact in contacts%}
    
            <li>{{ contact[1] }}
                {{ contact[2] }}
                {{ contact[3] }}
                <a href="{{ url_for('delete_page', id=contact[0]) }}">
            Delete
        </a>
            </li>
        

    {% endfor %}
    </ol>
{% else %}
     <p>no contacts added yet</p>
{% endif %}

<br><br>

<a href="{{url_for ('home')}}">Home Page</a>

{% endblock %}
