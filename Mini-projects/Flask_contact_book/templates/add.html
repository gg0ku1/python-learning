{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Add Contact</h2>

<form action="{{ url_for('add_page') }}" method="POST">

    <div class="mb-3">
        <label class="form-label">Name</label>

        <input
            type="text"
            name="name"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>

        <input
            type="text"
            name="phone"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>

        <input
            type="email"
            name="email"
            class="form-control"
            required>
    </div>

    <button
        type="submit"
        class="btn btn-success">
        Add Contact
    </button>

</form>

{% endblock %}
