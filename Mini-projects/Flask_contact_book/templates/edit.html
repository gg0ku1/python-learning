{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Edit Contact</h2>

<form action="{{ url_for('edit', id=contact[0]) }}" method="POST">

    <div class="mb-3">
        <label class="form-label">Name</label>

        <input
            type="text"
            name="name"
            value="{{ contact[1] }}"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ contact[2] }}"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>

        <input
            type="email"
            name="email"
            value="{{ contact[3] }}"
            class="form-control"
            required>
    </div>

    <button
        type="submit"
        class="btn btn-warning">
        Update Contact
    </button>

</form>

{% endblock %}
