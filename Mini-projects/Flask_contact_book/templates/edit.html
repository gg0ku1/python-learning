{% extends "base.html" %}

{%block content%}

<h1>Edit Contact</h1>

<form action="{{ url_for('edit', id=contact[0]) }}" method = "POST">

    <label>Name:</label><br>
    <input
    type="text"
    name="name"
    value="{{ contact[1] }}">
    <br><br>

    <label>Phone:</label><br>
    <input
    type="text"
    name="phone"
    value="{{ contact[2] }}">
    <br><br>

    <label>Email:</label><br>
    <input
    type="text"
    name="email"
    value="{{ contact[3] }}">
    <br><br>

    <button>Save Changes</button>
    


</form>


{% endblock %}
